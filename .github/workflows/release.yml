name: Release

on:
  release:
    types: [published]

env:
  package_type: system
  node_version: 24

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.node_version }}

      - name: Cache Node.js modules
        uses: actions/cache@v4
        with:
          path: .npm
          key: ${{ runner.OS }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.OS }}-node-
            ${{ runner.OS }}-

      - name: Install dependencies
        run: npm ci --cache .npm --prefer-offline

      - name: Extract tag version number
        id: get_version
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VERSION="${TAG#v}"
          echo "version=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version-without-v=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Substitute Manifest and Download Links For Versioned Ones
        id: sub_manifest_link_version
        env:
          VERSION: ${{ steps.get_version.outputs.version-without-v }}
          TAG_NAME: ${{ github.event.release.tag_name }}
          REPO: ${{ github.repository }}
          PKG_TYPE: ${{ env.package_type }}
        run: |
          node -e '
            import fs from "node:fs";
            const file = `src/${process.env.PKG_TYPE}.json`;
            const manifest = JSON.parse(fs.readFileSync(file, "utf8"));
            manifest.version = process.env.VERSION;
            manifest.url = `https://github.com/${process.env.REPO}`;
            manifest.manifest = `https://github.com/${process.env.REPO}/releases/latest/download/${process.env.PKG_TYPE}.json`;
            manifest.download = `https://github.com/${process.env.REPO}/releases/download/${process.env.TAG_NAME}/${process.env.PKG_TYPE}.zip`;
            fs.writeFileSync(file, JSON.stringify(manifest, null, 2) + "\n");
          '

      - name: Build
        run: npm run build

      - name: Archive production artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  publish:
    needs:
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download production artifacts for publication
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Create zip file
        working-directory: ./dist
        run: zip -r ../${{ env.package_type }}.zip .

      - name: Create release
        id: create_version_release
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          name: ${{ github.event.release.name }}
          # token: ${{ secrets.GITHUB_TOKEN }}
          token: ${{ secrets.GH_TOKEN }}
          artifacts: './dist/${{ env.package_type }}.json, ./${{ env.package_type }}.zip'
          body: ${{ toJSON(github.event.release.body) }}
